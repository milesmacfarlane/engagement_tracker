version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: engagement_tracker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: engagement_tracker
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with other PostgreSQL instances
    volumes:
      - engagement_tracker_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  engagement_tracker_db:
